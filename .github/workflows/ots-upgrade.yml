name: ots-upgrade

# Upgrades EXISTING proofs from calendar commitments to Bitcoin attestations.
# It never stamps a new target and never replaces a proof.
#
# An upgrade ENRICHES a detached proof by adding attestation paths the calendars
# have since learned. It does not change what the proof commits to. Both
# invariants are asserted below and the run fails closed if either breaks.
#
# Separate from stamp-new-artifacts by design: combining "target changed" with
# "delete and stamp again" is exactly the destructive behaviour that discarded
# earned Bitcoin attestations on every ledger append.

on:
  schedule:
    - cron: "17 6 * * *"        # daily, off the hour to avoid calendar rush
  workflow_dispatch:

# No `push` trigger at all. An upgrade run commits .ots and proof_status.json;
# with a push trigger that commit would re-invoke this workflow. Excluding the
# trigger entirely is stronger than relying on a commit-message token.

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ots-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04            # exact runner image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"   # exact

      - name: Install pinned OpenTimestamps
        run: pip install -r .github/requirements-ots.txt

      - name: Record pre-upgrade state
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          proofs = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(pathlib.Path('.').rglob('*.ots'))}
          targets = {}
          for p in sorted(pathlib.Path('.').rglob('*.ots')):
              t = pathlib.Path(str(p)[:-4])
              if t.exists():
                  targets[str(t)] = hashlib.sha256(t.read_bytes()).hexdigest()
          pathlib.Path('.pre.json').write_text(json.dumps({"proofs": proofs, "targets": targets}))
          print(f"{len(proofs)} proofs, {len(targets)} targets recorded")
          PY

      - name: Upgrade pending proofs
        run: python .github/tools/ots_upgrade.py --root . --apply --out proof_upgrade_status.json

      - name: Assert targets untouched, commitments unchanged, no proof lost
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, sys
          pre = json.loads(pathlib.Path('.pre.json').read_text())
          bad = []
          for f, h in pre["targets"].items():
              p = pathlib.Path(f)
              if not p.exists():
                  bad.append(f"TARGET DELETED: {f}")
              elif hashlib.sha256(p.read_bytes()).hexdigest() != h:
                  bad.append(f"TARGET MUTATED: {f}")
          for f in pre["proofs"]:
              if not pathlib.Path(f).exists():
                  bad.append(f"PROOF DELETED: {f}")
          st = json.loads(pathlib.Path('proof_upgrade_status.json').read_text())
          for r in st["proofs"]:
              if r["status"] == "TARGET_MISMATCH":
                  bad.append(f"COMMITMENT CHANGED: {r['ots_file']}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("targets untouched; no proof deleted; all commitments unchanged")
          PY

      - name: Regenerate proof status
        run: |
          python .github/tools/build_proof_status.py --root . --out proof_status.json
          mkdir -p site && cp proof_status.json site/proof_status.json

      - name: Open a pull request only if proof bytes actually changed
        run: |
          set -euo pipefail
          rm -f .pre.json
          git config user.name  "edgecard-timestamps"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.ots' proof_status.json site/proof_status.json proof_upgrade_status.json
          if git diff --cached --quiet; then
            echo "No proof changed - no commit, no PR."
            exit 0
          fi
          BR="ots-upgrade/$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BR"
          git commit -m "OpenTimestamps: enrich pending proofs with Bitcoin attestations"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "OTS upgrade $(date -u +%Y-%m-%d)" \
            --body "Automated proof enrichment. Target artifacts untouched, committed digests unchanged, no proof deleted. Review checklist: (1) diff contains only .ots and proof_status.json; (2) every .ots is larger, none removed; (3) proof_upgrade_status.json shows no TARGET_MISMATCH."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
